apiVersion: apps/v1
kind: Deployment
metadata:
  name: pbl7-app-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pbl7-app
  template:
    metadata:
      labels:
        app: pbl7-app
    spec:
      containers:
      - name: web
        image: your-dockerhub-username/pbl7-app:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: pbl7-app-service
spec:
  type: NodePort
  selector:
    app: pbl7-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30007
